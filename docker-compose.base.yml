services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metricyak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metricyak}
      POSTGRES_DB: ${POSTGRES_DB:-metricyak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
