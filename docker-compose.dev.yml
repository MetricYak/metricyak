name: metricyak-dev

services:
  db:
    extends:
      file: docker-compose.base.yml
      service: db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  maildev:
    image: maildev/maildev:2.2.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "1080:1080"

volumes:
  postgres-data:
